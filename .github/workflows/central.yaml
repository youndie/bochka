# Uploads a released version to Maven Central, by hand and on purpose.
#
# Not part of `publish.yml`, and not triggered by the tag. Three reasons, and the first one is the
# only one that would matter on its own:
#
#   * **a tag is spent once.** The rest of the release — the image, the chart, the Reposilite
#     modules — is refused a second time by the registries themselves, so a Central upload failing
#     inside that workflow would leave a version published everywhere but here and no way to retry
#     without a new number. Here the run is a button, and a failed attempt costs nothing;
#   * **the portal refuses for reasons only it knows** — a namespace not verified yet, a signature
#     it cannot check, a POM field it reads differently. Those are worth meeting on a re-runnable
#     job rather than on a tag;
#   * **the release itself stays a click.** `publishToMavenCentral` uploads the bundle and leaves it
#     staged; `publishAndReleaseToMavenCentral` would release it automatically, and a Central
#     release can never be rewritten or taken back. The last step belongs to a person.
name: central

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The tree to build, a tag or a branch
        required: true
        default: main
        type: string
      version:
        description: The Maven version to publish it as, without the v — for example 0.6.0
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # THE TREE AND THE VERSION ARE TWO INPUTS, and the first release is why. `v0.6.0` was tagged
      # before this workflow existed, so its tree has neither `sborka.central` nor the sborka
      # version that reads it — checking the tag out would look right and fail with the publish
      # task simply not being there.
      #
      # What makes publishing another tree under that number honest is a fact that can be checked
      # rather than asserted, and the step below checks it: no file under `bochka-*/src` differs
      # between the two. The artefact is built from the same sources; what differs is the build
      # configuration that makes publishing possible at all.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The tags come too, so the step below can diff against one.
          fetch-depth: 0

      # REFUSED HERE RATHER THAN BY A MISSING TASK. Without the switch the publish plugin is not
      # applied, `publishToMavenCentral` does not exist, and Gradle's answer is "task not found" —
      # which reads as a typo in this file rather than as a tree that cannot publish.
      - name: The tree being built can publish to Central
        run: |
          grep -q '^sborka.central=true' gradle.properties || {
            echo "sborka.central is not set in ${{ inputs.ref }}, so nothing here can publish to" >&2
            echo "Central. Build a tree that has it." >&2
            exit 3
          }

      # WHAT IS ACTUALLY GOING OUT, said out loud before it goes. A version on Central can never be
      # rewritten, so if the sources under this ref differ from the tag of the same name, that is
      # worth reading in the log rather than discovering from a decompiler.
      - name: Say how this tree relates to the tag of the same version
        run: |
          tag=v${{ inputs.version }}
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            changed=$(git diff --name-only "$tag"..HEAD -- 'bochka-*/src' | wc -l)
            if [ "$changed" -eq 0 ]; then
              echo "sources identical to $tag; the difference is build and CI configuration:"
              git diff --stat "$tag"..HEAD | tail -20
            else
              echo "WARNING: $changed source files differ from $tag, and this will publish as" >&2
              echo "${{ inputs.version }} anyway. A version on Central cannot be replaced." >&2
              git diff --stat "$tag"..HEAD -- 'bochka-*/src' >&2
            fi
          else
            echo "there is no tag $tag; publishing ${{ inputs.version }} from ${{ inputs.ref }}"
          fi

      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      # The gate first, on the tree being uploaded. `publish.yml` ran it on this same commit at the
      # tag; running it again costs a minute and is the difference between "it passed once" and "it
      # passes on what is going out".
      - run: ./gradlew check

      # The version without the `v`: the git tag is `v0.6.0` and the Maven coordinate is `0.6.0`.
      # Getting that wrong publishes a version nobody asked for, under a number that can never be
      # reused.
      #
      # The property names are the plugin's, read out of its jar rather than remembered:
      # `mavenCentralUsername`, `mavenCentralPassword`, `signingInMemoryKey`,
      # `signingInMemoryKeyPassword`. Gradle takes each as ORG_GRADLE_PROJECT_<name>.
      #
      # The username and password are a **user token** from the portal, not the account's own
      # credentials.
      - name: Upload the bundle, staged
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          # Through the environment rather than spliced into the script: an input is text somebody
          # typed, and text pasted into a shell body is a command as much as it is a value.
          VERSION: ${{ inputs.version }}
        run: |
          # Refused here rather than by the portal after a ten-minute build: an unset secret arrives
          # as an empty string, the plugin sends no credentials, and the failure that comes back
          # says nothing about which of the four is missing.
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            case $name in
              MAVEN_CENTRAL_USERNAME) value=$ORG_GRADLE_PROJECT_mavenCentralUsername ;;
              MAVEN_CENTRAL_PASSWORD) value=$ORG_GRADLE_PROJECT_mavenCentralPassword ;;
              SIGNING_KEY) value=$ORG_GRADLE_PROJECT_signingInMemoryKey ;;
              SIGNING_PASSWORD) value=$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword ;;
            esac
            if [ -z "$value" ]; then
              echo "the repository secret $name is empty or not set; nothing was uploaded" >&2
              exit 3
            fi
          done

          # The `v` is not accepted quietly: `vX.Y.Z` is a git tag and `X.Y.Z` is a Maven
          # coordinate, and a bundle uploaded under the first is a version nobody asked for that
          # can never be reused.
          case $VERSION in
            v*) echo "the version is a Maven coordinate, without the v: ${VERSION#v}" >&2; exit 3 ;;
          esac
          echo "uploading $VERSION as a staged deployment; releasing it is a click in the portal"
          ./gradlew -PVERSION="$VERSION" publishToMavenCentral

      - name: What to do next
        run: |
          echo "The bundle is staged at https://central.sonatype.com/publishing/deployments"
          echo "Check it, then press Publish. Nothing is resolvable until you do, and nothing can be"
          echo "changed after you have."
