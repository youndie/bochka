# The gate, on every push and every pull request.
#
# One command, because that is a project rule: `./gradlew check` runs the tests and ktlint in every
# module, and nobody has to remember a second line here. The harnesses that need Docker and other
# people's clients are separate jobs — they take minutes rather than seconds, and a gate that takes
# minutes stops being run locally.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This job ran without a setup-java step until the sborka migration, to prove that the build
      # fetches its own JDK 25 toolchain and is green on a machine with no JDK at all. That claim
      # cannot be made any more, and the run that said so is worth writing down: the settings plugin
      # is a *dependency of the build itself*, resolved by the JVM Gradle runs on, and the runner's
      # is 17 —
      #
      #   > Could not resolve ru.workinprogress.sborka:settings:0.1.0.18
      #   > Dependency requires at least JVM runtime version 21. This build uses a Java 17 JVM.
      #
      # A JDK-free runner therefore cannot configure this build at all, never mind compile it. The
      # toolchain is still declared and still what compiles the code; what is gone is the proof that
      # nothing else was needed.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
      - run: ./gradlew check

  live-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain compiles with 25; this **runs** the distribution, and the start script uses
      # whatever `java` is on PATH. On this runner that is 17, and the failure is
      # `UnsupportedClassVersionError: class file version 69.0` — which reads as a build problem
      # and is a runtime one. The image does not need this line because it ships its own JRE.
      #
      # The shared action installs 21 and 25 and leaves 25 as the default, which is what this job
      # needs; the version lives in sborka now rather than in three copies here.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
      # The metric this project is measured by is other people's clients, not its own tests (Р6).
      - run: ./ci/live-clients.sh

  enospc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
      # A volume that ends, which no ordinary `check` can produce: the stand needs `mount`, and a
      # gate that runs as root to get one would be paying more than the check is worth (M-264).
      #
      # This job is also what keeps the test honest. Without `BOCHKA_ENOSPC_DIR` the test returns
      # on its first line, so in the ordinary gate it is a pass that touched nothing — which would
      # be a silent gate if nothing ever provided the directory. This provides it, and the harness
      # refuses a run whose tests never reached the volume.
      - run: ./ci/enospc.sh

  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
      # The systems that build a table on top of an object store, which ask for promises no
      # round-trip test reaches: a commit decided by a conditional write, a snapshot found by
      # walking a listing, somebody else's file layout read by range (M41). The harness refuses a
      # run in which no consumer executed, so an image that cannot be pulled cannot pass as a tick.
      - run: ./ci/consumers.sh

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
      # No `|| true`, and that was a real bug rather than a tidy-up. The script already exits zero
      # for **any** score — a threshold on somebody else's suite would be a threshold on their
      # release schedule — and non-zero only when the run itself is broken: nothing ran, the build
      # failed, the server never came up. `|| true` swallowed exactly those, and this job reported
      # a green tick for a run in which the server would not start at all.
      - run: ./ci/s3-tests.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
      # A JDK is installed here for the same reason as in the gate: Gradle itself has to run on 21+
      # to resolve the settings plugin. It does not weaken what this job tests — the image's runtime
      # is the one inside the image, and the smoke test runs it in a container that has no access to
      # the runner's.
      # Everything about the image that the gate cannot see: the user, the volume, the runtime
      # profile surviving JAVA_OPTS, a misspelt setting stopping the process.
      - run: ./ci/docker-smoke.sh
      # The chart job installs *this* image rather than the published one, so that a pull request
      # is checked against what it changed. Handed over as an artefact because jobs do not share a
      # daemon; building it twice would be four more minutes for the same bytes.
      - name: Hand the image to the chart job
        run: docker save bochka:smoke -o bochka-image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: bochka-image
          path: bochka-image.tar
          retention-days: 1

  chart:
    # The Helm chart, on every pull request rather than at release time. A check that only runs on
    # a release rots unseen — that has already cost this repository eight merges with a red main
    # and green pull requests — and this one has more to lose than most: the smoke test above looks
    # at Docker, and Docker does not have service-link environment variables, an arbitrary uid
    # against a root-owned volume, or an orchestrator that reads 403 as a failed probe. Every
    # decision in the chart came out of that difference, so the harness has to cover it.
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          # Pinned, like the aws-cli image the harness loads, and for the same reason: unpinned this
          # installs whatever helm released this week, and a check whose result depends on somebody
          # else's release schedule is also checking their schedule. It has already happened — helm
          # changed the wording of a schema violation from "Expected: boolean" to "got string, want
          # boolean", and a chart that refused the value exactly as designed turned this job red.
          # Moving this number is a deliberate edit, made when somebody is looking at the output.
          version: v4.2.4
      - uses: helm/kind-action@v1
        with:
          # The harness creates and deletes its own cluster: it names the release `bochka` on
          # purpose, so that the Service is named `bochka` and kubelet would inject BOCHKA_* into
          # the pod. A cluster somebody else made would be one more thing to reason about.
          install_only: true
      - uses: actions/download-artifact@v8
        with:
          name: bochka-image
      - run: docker load -i bochka-image.tar
      # `yes` rather than the default `auto`: a missing kind has to be a red job. The stage this
      # gates is the only one that has met a kubelet, and a harness that silently skips it would
      # report a green tick for the half that proves nothing.
      - run: BOCHKA_IMAGE=bochka:smoke BOCHKA_CHART_KIND=yes ./ci/helm-chart.sh
