# Publishing, on a tag and never otherwise.
#
# Two artefacts and two destinations, because they are two different things: the server is an
# image somebody runs, and `bochka-embedded` is a jar somebody compiles against. Neither is
# published from a branch — a tag is the only thing that says "this exact tree is a version", and
# a build with no `-PVERSION` produces a snapshot on purpose (root build file).
#
# The gate runs first and the publish depends on it. That ordering is the whole value of this file:
# an image built in the same job as its tests can be pushed before they finish.
name: publish

on:
  push:
    tags: ['v*']

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check
      - run: ./ci/docker-smoke.sh

  image:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the distribution the image is made of
        run: ./gradlew -PVERSION=${GITHUB_REF_NAME#v} :bochka-app:installDist
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # An index rather than one manifest (M-137). Until this was here, `docker manifest inspect`
      # returned a single amd64 manifest, so an arm64 node -- Graviton, Ampere, kind on Apple
      # silicon -- pulled it happily and answered `exec format error`, which reads as a broken image
      # rather than as the wrong architecture. Cheap here and nowhere else: this image compiles
      # nothing, so emulation runs one `useradd` and a copy.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # The version and `latest`, not `latest` alone: a tag that moves is not a thing anybody
          # can pin, and a deployment that cannot pin cannot roll back.
          tags: |
            ghcr.io/youndie/bochka:${{ github.ref_name }}
            ghcr.io/youndie/bochka:latest

  maven:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v4
      # Every module, not just `:bochka-embedded:`. Its POM names the other four, and a publish
      # that pushes one of five is indistinguishable from a good one on this side — the artefact
      # is there, the task is green, and the failure is a consumer's `Could not find
      # io.github.youndie.bochka:bochka-core`. Which is exactly what the `consume` job below said
      # the first time this ran, and the reason it exists.
      # This step is **not** idempotent, and that is the repository being right rather than a bug
      # to work around: Reposilite answers `409 Conflict` to a second PUT of an already-published
      # release, because a release that can be rewritten is a version nobody can pin. A re-run of
      # this job for a tag that already published will therefore fail, and the fix is a new tag,
      # not a retry. (It also means a partial publish stops at the first module already present —
      # which is how four of five modules came to be missing the first time.)
      - name: Publish every module a consumer has to resolve
        env:
          BOCHKA_REPO_URL: ${{ secrets.BOCHKA_REPO_URL }}
          BOCHKA_REPO_USER: ${{ secrets.BOCHKA_REPO_USER }}
          BOCHKA_REPO_SECRET: ${{ secrets.BOCHKA_REPO_SECRET }}
        run: ./gradlew -PVERSION=${GITHUB_REF_NAME#v} publishAllPublicationsToBochkaRepoRepository

  chart:
    # On `needs: gate` like the other two, and for the reason those two are separate jobs at all: a
    # chart published beside an image that did not pass is a chart that installs an untested server.
    #
    # An OCI package in ghcr next to the image, rather than a `gh-pages` branch with an `index.yaml`.
    # The second mechanism is a second place where a version can drift from the image it names, and
    # this repository has already paid for one of those (`consume` asking for a tag nobody pushed).
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The one thing a chart can be wrong about that nothing else would notice: `appVersion` is the
      # default image tag, so a chart published with last release's appVersion installs last
      # release's server while calling itself this one. The chart's own `version` is deliberately
      # not checked against anything -- a chart that fixes a label is republished on purpose, which
      # is exactly where it differs from the image.
      - name: The chart names the release being published
        run: |
          have=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' deploy/helm/bochka/Chart.yaml)
          if [ "$have" != "$GITHUB_REF_NAME" ]; then
            echo "appVersion is '$have' and the tag is '$GITHUB_REF_NAME': the chart would install another release"
            exit 1
          fi
      - name: Log in to the registry the image goes to
        run: helm registry login ghcr.io -u ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push
        run: |
          helm package deploy/helm/bochka --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP"/bochka-*.tgz oci://ghcr.io/youndie/charts

  consume:
    # The check that matters, and the one a publish job cannot make about itself: build something
    # else against what was just published, the way a consumer would (booblik, M9). A publication
    # that exists and cannot be resolved — wrong coordinates, a missing POM, a dependency that was
    # never published — looks identical to a good one from the publishing side.
    needs: [image, maven, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pull the image and resolve the jar, the way a consumer would
        env:
          BOCHKA_IMAGE: ghcr.io/youndie/bochka:${{ github.ref_name }}
          # Explicit, and not derived from the image tag. The script's default takes the version
          # from after the last colon, which is `v0.1.0` — the git tag. The Maven coordinate is
          # `0.1.0`, without the `v`, because that is what `-PVERSION` was given. Left to the
          # default, this job asks the repository for a version nobody published and reports the
          # publication broken.
          BOCHKA_VERSION: ${{ github.ref_name }}
          BOCHKA_REPO_URL: ${{ secrets.BOCHKA_REPO_URL }}
        run: |
          BOCHKA_VERSION="${BOCHKA_VERSION#v}" ./ci/consume-published.sh
      # The same question asked of the chart, and it has its own way of being wrong: a chart pushed
      # to an OCI registry under a name that does not match `name:` in Chart.yaml resolves for
      # nobody, and `helm push` says nothing about it.
      - name: Pull the chart back out, the way somebody installing it would
        run: |
          helm pull oci://ghcr.io/youndie/charts/bochka --version "$(sed -n 's/^version: *//p' deploy/helm/bochka/Chart.yaml)" \
            --destination "$RUNNER_TEMP"
          # The quotes are the template's, and matching without them is a check that cannot pass:
          # `image: "{{ .Values.image.repository }}:…"` has been quoted since the chart was written.
          # This step was added after v0.2.0 and first ran at v0.3.1, where it failed for its own
          # reason rather than the chart's — written, but never called until it was.
          #
          # The output is read whole rather than through `grep -q`, which exits at the first match
          # and leaves the writer to its left with a SIGPIPE; under `pipefail` that is a status of
          # 141 and a false negative that grows with the output (the same shape ci/ carried for
          # months).
          rendered=$(helm template "$RUNNER_TEMP"/bochka-*.tgz \
            --set auth.keys[0].id=k --set auth.keys[0].secret=s)
          case $rendered in
            *"image: \"ghcr.io/youndie/bochka:$GITHUB_REF_NAME\""*) ;;
            *)
              echo "the published chart does not install $GITHUB_REF_NAME; it renders:"
              echo "$rendered" | grep 'image:' || true
              exit 1
              ;;
          esac
