apiVersion: v2
name: bochka
description: S3-compatible object storage on one node and one disk — one process, one volume, no replication and no failover.
type: application

# The chart's own version, moved by chart changes alone. It is not the server's: an image is
# published once per tag and can never be rewritten (Reposilite answers 409 to a second PUT, see
# publish.yml), while a chart that fixes a label has nothing to do with the server it installs.
version: 0.1.0

# `v0.2.0`, with the letter, because that is the tag the release actually pushes:
# `ghcr.io/youndie/bochka:${{ github.ref_name }}`, and `github.ref_name` is the git tag
# (publish.yml:35, :41-49). `0.2.0` without the `v` exists only as a Maven coordinate, so
# `appVersion: 0.2.0` together with a template that reads `.Chart.AppVersion` asks GHCR for a tag
# that is not there. The `consume` job in this repository already made exactly that mistake.
#
# The `v` lives here rather than in the template on purpose: a `printf "v%s"` in the template moves
# the rule out of sight and breaks in silence if a release ever stops writing the letter. This line
# is read by eye, and by `helm list` in the APP VERSION column.
#
# **Три строки едут вместе с этой.** `probes.type` и `nodeSelector` в `values.yaml` держат самое
# узкое умолчание, потому что образ `appVersion` — без ручки здоровья и без второй архитектуры;
# выпуск, который двигает эту строку, обязан подвинуть и те две. `publish.yml` проверяет только
# одно: что `appVersion` — это публикуемый тег, потому что чарт с прошлым `appVersion` ставит
# прошлый сервер, называя себя этим.
appVersion: "v0.2.0"

# 1.29, and it is two requirements rather than one. `persistentVolumeClaimRetentionPolicy` is
# beta-on-by-default from 1.27 — on an older cluster the field is dropped without a word, and "the
# volume outlives `helm uninstall`" becomes a promise this chart states and cannot keep.
# `ReadWriteOncePod` is GA from 1.29, and it is the default access mode here (M-147) because it is
# the only thing that gives this store one writer at the API rather than one writer per node.
#
# What that excludes: 1.27 and 1.28, both out of support since 2024. A floor derived from a feature
# the chart actually uses beats a floor picked to be welcoming.
kubeVersion: ">=1.29.0-0"

home: https://github.com/youndie/bochka
sources:
  - https://github.com/youndie/bochka
keywords:
  - s3
  - object-storage
  - storage
maintainers:
  - name: youndie
    url: https://github.com/youndie
