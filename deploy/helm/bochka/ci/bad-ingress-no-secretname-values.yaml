# A TLS entry with no `secretName` and nobody saying who provides the certificate. Legal
# Kubernetes, and two very different arrangements look identical here: a controller that really
# holds the certificate (Traefik's ACME resolver keeps it in acme.json), and an accidental
# fall-through to the controller's default one, which is usually self-signed.
auth:
  keys:
    - id: chartkey
      secret: chartsecret
ingress:
  enabled: true
  hosts:
    - host: s3.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - s3.example.com
