# A wildcard host without the matching virtual-host suffix routes virtual-hosted requests as
# path-style, and the signature stops agreeing with the routing. Must fail.
auth:
  keys:
    - id: chartkey
      secret: chartsecret
ingress:
  enabled: true
  hosts:
    - host: "*.s3.example.com"
  tls:
    - secretName: s3-example-com-tls
