# The same controller, with the four requirements expressed for it and said so. This renders — and
# renders without the nginx annotations, which on Traefik would be lines that look like
# configuration and are not.
auth:
  keys:
    - id: chartkey
      secret: chartsecret
ingress:
  enabled: true
  className: traefik
  requirementsExpressedFor: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-bochka-buffering@kubernetescrd
  hosts:
    - host: s3.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: s3-example-com-tls
      hosts:
        - s3.example.com
