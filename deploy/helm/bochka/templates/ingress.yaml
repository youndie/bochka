{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.tls }}
{{- fail "ingress.enabled is set without ingress.tls. bochka never terminates TLS itself (research §1.7), so an Ingress without a certificate publishes SigV4 requests in the clear — including the signed Host and every header they cover. Add ingress.tls, or put your own terminator in front of the ClusterIP Service." }}
{{- end }}
{{- if not .Values.ingress.hosts }}
{{- fail "ingress.enabled is set without ingress.hosts. The Host header is part of the signature (deploy/nginx/nginx.conf:75-77), so a rule with no host would answer requests whose signature was computed over a name this Ingress never sees." }}
{{- end }}
{{/*
A wildcard host means virtual-hosted-style requests — `bucket.s3.example.com` — and the server only
routes those for domains it was told about: bucketFromHost walks `virtualHostSuffixes` and returns
null otherwise, which is path-style (S3Router.kt:477-486). A wildcard Ingress with an empty or
different suffix list therefore accepts the request, routes it as path-style, and the signature
disagrees with the routing. Checked here rather than trusted, because the client sees it as a
credentials problem.
*/}}
{{- $suffixes := list }}
{{- range .Values.virtualHostSuffixes }}
{{- $suffixes = append $suffixes (lower .) }}
{{- end }}
{{- range .Values.ingress.hosts }}
{{- if hasPrefix "*." .host }}
{{- $domain := lower (trimPrefix "*." .host) }}
{{- if not (has $domain $suffixes) }}
{{- fail (printf "ingress.hosts contains the wildcard %q while virtualHostSuffixes does not list %q. Virtual-hosted requests to that domain would be routed as path-style and the signature would not match. Add %q to virtualHostSuffixes — without the leading dot, the code adds it." .host $domain $domain) }}
{{- end }}
{{- end }}
{{- end }}
{{/*
And the same check the other way, which is the half that diagnoses worse. A suffix the server knows
about with no `*.<suffix>` rule in this Ingress means `bucket.s3.example.com` matches no rule at all:
the controller answers its own 404 or its default backend, the request never reaches the Service, and
bochka logs nothing because nothing arrived. The client reads that as "the bucket is not there" while
the server half is configured correctly. The certificate for such a host is needed either way, so
this refusal names work that already existed rather than adding any.
*/}}
{{- $wildcards := list }}
{{- range .Values.ingress.hosts }}
{{- if hasPrefix "*." .host }}
{{- $wildcards = append $wildcards (lower (trimPrefix "*." .host)) }}
{{- end }}
{{- end }}
{{- range $suffixes }}
{{- if not (has . $wildcards) }}
{{- fail (printf "virtualHostSuffixes lists %q while ingress.hosts has no rule for \"*.%s\". Virtual-hosted requests — bucket.%s — would match no rule in this Ingress and never reach the service at all; the controller answers them itself, and the client sees a missing bucket rather than a missing route. Add a host \"*.%s\" (with a certificate that covers it), or drop the suffix and stay path-style." . . . .) }}
{{- end }}
{{- end }}
{{/*
M-146: which controller this chart is for, and what happens on any other one.

The annotation defaults are ingress-nginx's, and they are four requirements rather than taste
(deploy/nginx/nginx.conf): unlimited body size, request buffering off, response buffering off, long
read and send timeouts. On Traefik, HAProxy or a Gateway API implementation those keys are inert —
the Ingress renders, the controller ignores every one of them, and the first upload over a megabyte
is a 413 from a proxy nobody configured for this server. Silently: nothing in the manifest, the
release or the log says the requirements were dropped.

So the class is either one this chart knows, or one the operator says they have configured
themselves. Accepting a class and not expressing its requirements is the same shape as accepting a
bucket policy and not enforcing it, and this repository refuses that one too.
*/}}
{{/*
M-216: a TLS entry with no `secretName`.

Kubernetes allows it and it means one exact thing — "the controller has the certificate for these
hosts, I am not handing you one". That is how Traefik's own ACME resolver works: the certificate
lives in its acme.json and never becomes a Secret, so a chart that insists on a `secretName` cannot
express the arrangement at all.

It is also how a controller's *default* certificate gets used by accident, and that one is usually
self-signed. The difference between the two is invisible in the manifest and very visible to a
client, which is the shape of thing this chart refuses in silence and asks for out loud instead:
name the controller that provides it. An empty string stays a refusal.
*/}}
{{- range .Values.ingress.tls }}
{{- if not .secretName }}
{{- if not $.Values.ingress.certificateFromController }}
{{- fail (printf "ingress.tls has an entry with no secretName, for %v. That is legal Kubernetes and means the controller already holds a certificate for those hosts — Traefik's own ACME resolver, for instance, keeps it in acme.json and never makes a Secret. It is also what an accidental fall-through to the controller's default certificate looks like, and that one is usually self-signed: the client sees an untrusted certificate on requests carrying signed credentials. Set ingress.certificateFromController to the name of the controller that provides it, or give the entry a secretName." .hosts) }}
{{- end }}
{{- end }}
{{- end }}
{{- $class := .Values.ingress.className | default "nginx" }}
{{- if and (ne $class "nginx") (ne $class .Values.ingress.requirementsExpressedFor) }}
{{- if eq $class "traefik" }}
{{/*
M-211: the one foreign controller this chart has measured rather than reasoned about, and the
reason the refusal above cannot simply say "put them in annotations".

Three of the four requirements are Traefik's defaults and need nothing. The fourth is not
expressible from an Ingress **at all**, by anybody: it lives in Traefik's static configuration,
which belongs to the Traefik install rather than to any release routed through it. A chart that
told the operator to write it into annotations would be sending them somewhere the setting does
not exist.
*/}}
{{- fail (printf "ingress.className is \"traefik\", and this chart's annotation defaults are ingress-nginx's — on traefik they are inert. Measured on v3.6.0 (docs/measurements.md, M-211): buffering is off in both directions and there is no body size limit, so three of the four need nothing from you. Two things do. (1) entryPoints.<name>.transport.respondingTimeouts.readTimeout defaults to 60s and lives in Traefik's static configuration, which no Ingress can reach: an upload slower than a minute is cut mid-body. Set it to 0 on the entryPoint serving this Ingress. (2) A response bochka produces before reading the body — every refusal by signature, by ACL or by a missing bucket — does not reach a client that is waiting for 100 Continue, unless the declared body is over 256 KiB; below that Go drains the rest of the request first and both sides wait. That one has no setting: it is what running behind a Go proxy costs, and six of ceph/s3-tests fail on it. Set ingress.requirementsExpressedFor: \"traefik\" when you have read both.") }}
{{- else }}
{{- fail (printf "ingress.className is %q, and this chart's annotation defaults are ingress-nginx's — on %s they are inert. bochka needs four things from whatever proxies it: no body size limit, request buffering off, response buffering off, and read/send timeouts long enough for a large upload (deploy/nginx/nginx.conf). Express them in ingress.annotations for your controller and set ingress.requirementsExpressedFor: %q to say so — or put your own terminator in front of the ClusterIP Service and leave ingress.enabled false." $class $class $class) }}
{{- end }}
{{- end }}
{{/*
And the nginx keys come off for a foreign class rather than riding along. An inert annotation on
somebody else's Ingress is a line that looks like configuration and is not.
*/}}
{{- $annotations := dict }}
{{- range $name, $value := .Values.ingress.annotations }}
{{- if or (eq $class "nginx") (not (hasPrefix "nginx.ingress.kubernetes.io/" $name)) }}
{{- $_ := set $annotations $name $value }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bochka.fullname" . }}
  labels:
    {{- include "bochka.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range (.paths | default (list (dict "path" "/" "pathType" "Prefix"))) }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "bochka.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
