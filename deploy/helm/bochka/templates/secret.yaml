{{- if not .Values.auth.existingSecret }}
{{- include "bochka.validate" . -}}
{{- /*
base64 here is an encoding and not a secrecy measure, and this chart does not pretend otherwise.
There is a larger hole in the same direction that it cannot close: the server prints its whole
configuration at startup and `keys` is printed verbatim (Configuration.kt:76-80), so this value
reaches `kubectl logs` and every collector reading it, on the first line of every start. NOTES.txt
says that out loud rather than letting a Secret imply a promise nothing keeps.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bochka.fullname" . }}
  labels:
    {{- include "bochka.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "bochka.secretKey" . }}: {{ include "bochka.keysValue" . | b64enc | quote }}
{{- end }}
