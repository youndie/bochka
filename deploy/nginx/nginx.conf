# nginx in front of bochka: TLS here, plaintext on the loopback behind it.
#
# This is not a convenience, it is the architecture (research, Р5 and §1.7). TLS cannot terminate
# inside the JVM without losing the zero-copy read path: kTLS needs the session's traffic secrets
# and JSSE exports none, so a Java server that speaks TLS must encrypt every byte in user space.
# nginx does not have that problem: with `ssl_conf_command Options KTLS` it hands the kernel the
# keys, and the encryption happens there rather than in its own address space.
#
# **What this does not buy, and the comment used to claim it did.** `sendfile` through TLS applies
# when nginx serves a *file*. Here it proxies, so there is no file and `SSL_sendfile` never touches
# the response body. Measured on the stand (docs/measurements.md): the same TLS, the same kTLS and
# the same bytes cost 0.898 processor-seconds per gibibyte when nginx has a file and 2.408 when it
# relays an upstream socket — 2.7x, and the difference is exactly the fast path this file used to
# say was preserved. kTLS is still worth having; it is worth 15%, not multiples.
#
# Р5 stands on the other half of its argument, which the same stand confirmed: bochka's own read
# path stays at ~0.3 s/GiB because it never sees TLS, against 2.4 for nginx. Inside the JVM the
# server would pay for the encryption *and* lose the file-to-socket fast path (7.6x, measured) *and*
# put every byte through the heap.
#
# It is also the only way one of the four body framings appears at all: aws-cli sends
# `STREAMING-UNSIGNED-PAYLOAD-TRAILER` only over TLS, so without a terminator in front there is
# nothing that exercises it (ci/live-clients.sh has one for exactly this reason).

worker_processes auto;
events { worker_connections 1024; }

http {
    # Requests are proxied whole, and none of this is optional:
    #
    #   client_max_body_size 0  — nginx buffers and rejects bodies over a megabyte by default,
    #                             which turns every upload over that size into a 413.
    #   proxy_request_buffering off — otherwise nginx reads the entire upload to disk before
    #                             bochka sees a byte, which doubles the write and makes
    #                             `Expect: 100-continue` meaningless.
    #   proxy_http_version 1.1  — 1.0 has no chunked encoding, and the streaming framings are
    #                             chunked.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    # `sendfile` matters for anything nginx serves from disk itself. For the proxied location
    # below it does nothing — a proxy has a socket, not a file — and it is left on rather than
    # removed because it is right for any static location somebody adds here later.
    #
    # The directive is a request, not a guarantee, in either case: `SSL_sendfile` needs Linux
    # 4.13+, OpenSSL 3.0+ and an AES-GCM cipher, and nginx falls back silently when any of that is
    # missing. Whether the kernel took it is answerable — `TlsTxSw` in /proc/net/tls_stat rises by
    # one per connection that uses kTLS — and guessing from the config is how a silent fallback
    # goes unnoticed for a year.
    sendfile on;
    tcp_nopush on;

    upstream bochka {
        # The loopback, because that is where bochka should be listening. A store reachable from
        # the network without TLS in front of it is a store whose signatures travel in the clear.
        server 127.0.0.1:9000;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256;
        ssl_conf_command    Options KTLS;

        location / {
            proxy_pass http://bochka;

            # `Host` is signed. Passing nginx's own idea of the host instead of the client's turns
            # every request into SignatureDoesNotMatch, and the error says nothing about proxies.
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";

            # bochka answers `100 Continue` itself, and it must be allowed to: the whole point of
            # deciding from the head is that a refusal costs no body (research, §1.2).
            proxy_set_header Expect $http_expect;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # Plain HTTP exists only to say where the real endpoint is.
    server {
        listen 80;
        return 308 https://$host$request_uri;
    }
}
