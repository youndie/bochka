# THERE WAS NO gradle.properties HERE AT ALL, so the build ran with no build cache and no parallel
# execution — two defaults nobody had chosen.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

kotlin.code.style=official

# A default that is a snapshot on purpose: a build with no -PVERSION must not be able to produce
# something that looks like a release. CI passes the tag, without the `v`.
version=0.1.0-SNAPSHOT

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
sborka.group=io.github.youndie.bochka
sborka.repository=youndie/bochka
sborka.description=An S3-compatible object store you can start from a test: one process, one disk, no cluster.
sborka.inceptionYear=2026

# 25 for both, and 25 is on the critical path rather than a preference: `FileChannel.map(mode,
# offset, size, Arena)` gives a mapping without the 2 GB ceiling and with a deterministic release,
# which is what the index log needs. A consumer therefore has to be on 25 as well, and the metadata
# says so — otherwise they resolve the library, compile against it, and meet
# UnsupportedClassVersionError at class loading.
sborka.jvmToolchain=25
sborka.jvmFloor=25

# The JUnit the catalog names is the JUnit the tests run on. `kotlin("test")` resolves to
# `kotlin-test-junit5`, which carries a Jupiter of its own and wins by default — so five of six
# modules once ran on 5.10.1 while the catalog said 5.14.4 and explained the choice in a comment.
sborka.junitVersion=6.1.3

# The package pitest mutates and whose tests it runs.
sborka.mutationPackage=io.github.youndie.bochka

# OFF, AND IT SHOULD NOT STAY OFF. `explicitApi()` is right for a published library and sborka turns
# it on by default; here it is 150 declarations in `:bochka-core` alone, and compilation stopped
# there before reaching the other seven modules. Spelling out a visibility and a return type on every
# public declaration is a change to the LIBRARY, not to how it is built — folded into the migration
# it would bury whatever the migration itself breaks in a diff nobody can read.
# Tracked separately: youndie/bochka#46.
sborka.explicitApi=false
