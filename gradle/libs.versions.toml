[versions]
# The shared build conventions. One number: every sborka plugin below takes its version from here.
sborka = "0.2.0.28"
# Checked against maven-metadata.xml of org.jetbrains.kotlin:kotlin-stdlib on 2026-08-17: 2.4.10 is
# the last stable, 2.4.20-RC is a release candidate.
kotlin = "2.4.10"
# The Gradle wrapper is pinned to 9.7.0 and the toolchain to JDK 25. This pair is not a guess — it
# is what the neighbouring project already builds on. Note that KGP declares a supported Gradle
# range: raising the wrapper alone fails with a message about an unsupported Gradle version rather
# than about Kotlin.
#
# The CLI and the Gradle plugin are versioned independently: the plugin only launches the CLI of the
# requested version, so the formatter is pinned here rather than left to the plugin default. Left to
# the default, the style shifts when the plugin is bumped — which is exactly when nobody reads the
# diff.
ktlint = "1.8.0"
ktlintGradle = "14.2.0"
# Benchmarks. kotlinx-benchmark drives JMH; JMH is what actually measures.
benchmark = "0.5.0"
# The selector loop turns readiness into something a coroutine can await; that is the only reason
# this is here. Checked against maven-metadata.xml on 2026-08-17.
coroutines = "1.11.0"
# The JUnit extension is the one place this project depends on a test framework from **main**
# code: `bochka-junit` exists for that, and no other module knows about it.
#
# This number also has to be enforced to mean anything. `kotlin("test")` brings a Jupiter of its
# own, and until the root build put `junit-bom` on every module as a platform, five of six ran on
# that one instead of on this — which is what makes a major bump here mean something, rather than
# move nothing for five modules and put a second engine on the sixth.
junit = "6.1.3"
# Reads compiled classes in a test. The only dependency here that exists to check a property of the
# code rather than to be part of it.
# Coverage-guided fuzzing of the parsers that read unauthenticated bytes (M38). Checked against
# maven-metadata.xml on 2026-08-26: 0.30.0 is the last version, released 2026-02-24.
jazzer = "0.30.0"
asm = "9.10.1"
# The client the embedded niche is actually occupied with on the JVM, and a test dependency of
# `bochka-embedded` only (M-230). It is here as an **oracle**, not as a reference: the MinIO
# *server* rejects keys S3 accepts and is explicitly not the standard here (project rule), while
# its *client* is somebody else's signer and framer, which is the whole point. Checked against
# maven-metadata.xml on 2026-08-23: 9.0.3 is the last version.
minio = "9.0.3"
testcontainers = "2.0.5"
lincheck = "2.39"
# Mutation testing. **Run as a CLI rather than through the Gradle plugin**, and that is not a
# preference: `info.solidsoft.gradle.pitest` was last released in September 2023, which is to say
# for Gradle 8, while the engine itself is alive and shipped 2026-08-04 — both checked against
# maven-metadata.xml. Going through the plugin would mean fixing somebody else's Gradle 9
# compatibility to obtain a run that already exists as a standalone program.
pitest = "1.30.0"
# A separate artefact, because pitest knows no test engine by itself: without it a run finds zero
# tests and reads as code that nothing can kill.
pitestJunit5 = "1.2.3"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
minio = { module = "io.minio:minio", version.ref = "minio" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
lincheck = { module = "org.jetbrains.kotlinx:lincheck", version.ref = "lincheck" }
pitest-cli = { module = "org.pitest:pitest-command-line", version.ref = "pitest" }
pitest-junit5 = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitestJunit5" }
benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "benchmark" }

[plugins]
sborkaJvm = { id = "ru.workinprogress.sborka.jvm", version.ref = "sborka" }
sborkaLint = { id = "ru.workinprogress.sborka.lint", version.ref = "sborka" }
sborkaPublish = { id = "ru.workinprogress.sborka.publish", version.ref = "sborka" }
sborkaMutation = { id = "ru.workinprogress.sborka.mutation", version.ref = "sborka" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# JMH needs its state classes open; Kotlin classes are final by default.
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "benchmark" }
